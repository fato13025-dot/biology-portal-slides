<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>مدخل إلى علم الأحياء</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="viewer" title="مدخل إلى علم الأحياء" allowfullscreen></iframe>
  <script>
    const pptxUrl = new URL('lesson.pptx', window.location.href).href;
    document.getElementById('viewer').src =
      'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(pptxUrl);
  </script>
</body>
</html>
