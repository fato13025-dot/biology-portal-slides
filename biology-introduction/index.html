<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>مدخل إلى علم الأحياء | بوابة الأحياء</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:#f5f6f3;font-family:Arial,"Tahoma",sans-serif;color:#26352e}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  .viewer{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 14px 10px;gap:10px}
  .stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
  .slide{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.10)}
  .controls{display:flex;align-items:center;justify-content:center;gap:16px;height:48px;flex:0 0 auto;direction:ltr}
  button{width:42px;height:42px;border-radius:50%;border:1px solid #d5ddd7;background:#fff;color:#4f6b5c;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  button:disabled{opacity:.32;cursor:default}
  .count{min-width:72px;text-align:center;font-size:14px;color:#66736b;direction:ltr}
  @media (max-width:700px){.viewer{padding:8px 6px 6px;gap:6px}.controls{height:42px}button{width:38px;height:38px}.count{font-size:13px}}
</style>
</head>
<body>
<div class="viewer">
  <div class="stage"><img id="slide" class="slide" src="slides/s1.png" alt="شريحة 1"></div>
  <div class="controls">
    <button id="prev" aria-label="السابق">‹</button>
    <div id="count" class="count">1 / 9</div>
    <button id="next" aria-label="التالي">›</button>
  </div>
</div>
<script>
const total=9; let current=1;
const img=document.getElementById('slide'), count=document.getElementById('count'), prev=document.getElementById('prev'), next=document.getElementById('next');
function render(){img.src='slides/s'+current+'.png';img.alt='شريحة '+current;count.textContent=current+' / '+total;prev.disabled=current===1;next.disabled=current===total;}
prev.onclick=()=>{if(current>1){current--;render();}};
next.onclick=()=>{if(current<total){current++;render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&current<total){current++;render()} if(e.key==='ArrowRight'&&current>1){current--;render()}});
let x0=null; document.addEventListener('touchstart',e=>x0=e.changedTouches[0].clientX,{passive:true}); document.addEventListener('touchend',e=>{if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>45){if(dx<0&&current<total)current++; else if(dx>0&&current>1)current--; render()} x0=null},{passive:true});
render();
</script>
</body>
</html>
