<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البكتيريا وبدائيات النوى</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f1;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}.viewer{width:min(1280px,100vw);padding:12px}.frame{background:white;box-shadow:0 10px 35px #0002;border-radius:12px;overflow:hidden}.frame img{display:block;width:100%;height:auto}.controls{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px}.controls button{border:0;background:#627966;color:#fff;width:46px;height:40px;border-radius:10px;font-size:22px;cursor:pointer}.controls button:disabled{opacity:.35}.count{min-width:76px;text-align:center;color:#4c554d;font-size:15px}@media(max-width:600px){.viewer{padding:0}.frame{border-radius:0}.controls{padding:8px}}</style></head><body><main class="viewer"><div class="frame"><img id="slide" alt="شريحة تعليمية"></div><div class="controls"><button id="prev">›</button><span class="count" id="count"></span><button id="next">‹</button></div></main><script>const total=11;let n=1;const img=document.getElementById('slide'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');function show(){img.src=`slides/s${n}.png`;count.textContent=`${n} / ${total}`;prev.disabled=n===1;next.disabled=n===total}prev.onclick=()=>{if(n>1){n--;show()}};next.onclick=()=>{if(n<total){n++;show()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&n>1){n--;show()}if(e.key==='ArrowLeft'&&n<total){n++;show()}});show();</script></body></html>
